# Growth OS 成长领域包
# ---------------------------------------------------------------------------
# 目的：把 evkg 的通用证据语义，重映射为"个人能力成长"领域语义。
#
#   evkg 原语义                      →  Growth OS 语义
#   ---------------------------------------------------------------
#   Claim（关于世界的断言）           →  能力断言「用户具备/缺乏 X 能力」
#   Evidence（支撑断言的原文）        →  能力证明（代码/任务提交/笔记/自述）
#   Source 来源分级                   →  证据强度分级（实践 > 行为 > 知识 > 自述）
#   Attack（质疑断言）                →  追问"这条能力结论站得住吗"（PRD §8）
#
# 关键机制说明（已核实）：
#   evkg/policies.py:18-22 用 `table[SourceKind(rule.kind)] = (baseline, rationale)`
#   覆盖内置策略表，`except ValueError: continue` —— 也就是说：
#     ✅ 6 个内置 kind 的 baseline 与 rationale **可以**被本文件覆盖
#     ❌ 本文件里写任何**新的** kind 字符串会被**静默忽略**（不报错！）
#   因此细粒度证据类型不走 kind，而走 Source.metadata.growth_evidence_type，
#   见 .project-to-act/docs/ARCHITECTURE.md §3.4。
# ---------------------------------------------------------------------------

name: growth_os
description: 个人能力成长领域包：证据重定义为能力证明，主张重定义为能力断言，来源分级重定义为证据强度分级
language: zh

# ---------------------------------------------------------------------------
# 切分：按段落（空行）而非按单换行
# evkg 默认 boundary 以 \n+ 开头，会把 Markdown 笔记切得过于零碎；
# 成长资料以笔记/README/文档为主，按段落切分更贴合语义单元。
# ---------------------------------------------------------------------------
splitting:
  boundary: |-
    \n{2,}|(?<=[。！？!?])(?![」』）】〕”’"'])|(?<=[。！？!?][」』）】〕”’"'])|(?<=\.)\s
  keep_short_chunks: true

# ---------------------------------------------------------------------------
# 实体词表：成长场景的核心实体是「能力 / 技术 / 项目」，而不是「人物 / 组织」
# ---------------------------------------------------------------------------
identity:
  type_labels:
    - person
    - 人物
    - capability
    - 能力
    - skill
    - 技能
    - technology
    - 技术
    - 技术栈
    - project
    - 项目
    - organization
    - 组织
    - 公司
    - tool
    - 工具
    - framework
    - 框架
  type_contains: [能力, 技能, 技术]
  identity_relations: [别名, 别称, 简称, 又名, 又称, 也称, 亦作, 旧称, aka, alias, abbrev]
  identity_predicates: [是, 为, 指, 即, 又称, 又名, 简称, 也称, 属于, 包括]

# ---------------------------------------------------------------------------
# Prompt 组：Growth OS 的攻击质量直接决定能力判定质量（PRD §10）
# ---------------------------------------------------------------------------
prompts:
  extractor_system: >-
    你是个人能力成长的证据阅读员。只抽取资料原文明确出现的信息，不得根据常识
    或上下文之外的知识补全，不得臆造用户的经历、项目或能力。输出必须服从 JSON
    Schema。本领域抽取的是「关于某个人具备或缺乏某项能力的可核查依据」，
    不是通用百科知识。

  extraction_rules:
    - "1. mentions：抽取原文明确出现的能力名（capability）、技术/工具/框架（technology）、项目（project）、组织（organization）、人物（person）。不要把抽象概念或动作标成实体。"
    - "2. identity_links：只有原文明确表达两个名称指同一对象时才填（如「RAG（检索增强生成）」、简称、又名）；canonical_surface 用正式名，alias_surface 用别名。"
    - "3. events：只填原文明确发生的、与能力形成相关的事件（完成项目、提交任务、通过考核、发布版本、修复缺陷），participant_surfaces 只能填原文出现的表面名。"
    - "4. claims：只填能由一个或多个真实 passage_id 直接支持的能力主张。subject 用原文出现的人（或「用户」）；predicate 用原文可支撑的措辞（具备能力/缺乏能力/使用过/实现过/设计过/优化过/学习过/计划学习）；object 用能力名。每条必须引用输入中的真实 passage_id。"
    - "5. 严禁升级：把「打算学」「计划做」「听说过」「了解过」写成「具备能力」。原文只表达意图或间接了解时，predicate 必须如实体现（如「计划学习」「有所了解」）。"
    - "6. 不作能力推断：原文描述的是某个项目用了什么技术，不等于用户具备该技术能力，除非原文同时明确了用户在该项目中的角色或贡献。"

  passage_header: "资料段落："

  # 审查：把"自称"与"被证明"分开
  reviewer_system: >-
    你是能力证据审查员。判断这条能力主张是否被原文**直接**支持。核心原则：
    用户声称会某项能力，不等于原文证明了该能力。若原文只是自述、计划或二手
    描述，而没有实践产物，必须给出 false 或 partial，不得因为语气自信就采信。

  falsifier_system: >-
    你是能力主张的证伪审查员，只报告给定能力主张之间有明确证据的矛盾，不要
    臆造。没有矛盾就返回空列表。

  # 独立复核：显式列举能力场景里最常见的三类高估
  verifier_system: >-
    你是独立复核员，职责是对抗抽取方的乐观倾向。逐项对照原文与主张，报告
    遗漏、臆造、错引和段落错配。特别核查以下三类常见高估：
    ① 把「了解 / 看过」当成「掌握」；
    ② 把「调用现成 API / 复制教程」当成「独立实现」；
    ③ 把「计划做 / 正在学」当成「已完成」。
    凡主张加入了原文没有的信息，必须拒绝。

  # ★ 红队提示词：直接落地 PRD §8「AI 主动攻击自己的判断」
  adversarial_system: >-
    你是个人能力证据库的红队。针对给定的能力主张生成最锋利的合理质疑，每条
    质疑必须指出具体的薄弱点，不得泛泛而谈。至少覆盖以下角度：
    1. 这条结论的证据是否只是用户自述？
    2. 是否只有理论笔记或二手资料，没有任何实践产物？
    3. 有没有代码或可运行的产物证据？
    4. 代码是否只是调用现成 API 或照抄教程，缺乏独立设计？
    5. 是独立完成的，还是跟随教程、他人协作或直接复用？
    6. 是否存在反向证据（失败记录、未完成、被指出错误、与自述相矛盾）？
    7. 是否存在与其他资料互相矛盾的说法？
    8. 证据是否过时，或缺乏近期证据支撑？
    如果某个角度没有对应证据，必须明确指出「这是缺失证据」，不得默认它成立。

# ---------------------------------------------------------------------------
# ★ 来源分级 → 证据强度分级（Growth OS 的核心重映射）
#
# 注意：kind 值必须落在这 6 个内置枚举内（domain.SourceKind）。
# 新增 kind 会被静默忽略。细粒度类型走 Source.metadata.growth_evidence_type。
#
#   growth_evidence_type    →  kind            baseline
#   ------------------------------------------------------
#   task_submission         →  primary         0.82   （任务证据，闭环自产）
#   repo_artifact           →  primary         0.82   （实践证据）
#   probe_result            →  contemporary    0.78   （行为证据）
#   uploaded_doc            →  compilation     0.68   （知识证据）
#   external_ref            →  modern_study    0.62   （不参与能力评级）
#   chat_assertion          →  folk            0.35   （弱证据）
# ---------------------------------------------------------------------------
source_policy:
  - kind: primary
    baseline: 0.82
    rationale: "用户的原始实践产物（任务提交、GitHub 代码、项目仓库）。能力的最强证据，但仍需核查是否为独立完成。"
  - kind: contemporary
    baseline: 0.78
    rationale: "与能力形成同期产生的记录（现场答题/测试结果、当次任务的会话记录）。属行为证据，反映当下真实表现。"
  - kind: compilation
    baseline: 0.68
    rationale: "用户整理或上传的笔记与文档。反映知识性理解，不足以证明实践能力。"
  - kind: modern_study
    baseline: 0.62
    rationale: "外部领域参考（岗位要求、官方文档、论文、教程）。仅用于生成目标能力模型，不参与用户能力评级。"
  - kind: folk
    baseline: 0.35
    rationale: "用户自述与对话中的能力声明。弱证据：只能触发澄清或生成任务，不得单独支撑任何能力结论。"
  - kind: unknown
    baseline: 0.25
    rationale: "来源类型未知，需人工核验后才能提高评级。"

# ---------------------------------------------------------------------------
# 标注与否定词
# ---------------------------------------------------------------------------
annotation:
  time_patterns:
    - "(?:公元前|公元)?\\d{3,4}(?:年|年间|年初|年末|-?\\d{1,2}月)"
    - "\\d{4}-\\d{1,2}-\\d{1,2}"
    # 成长时间线常用写法：2026.07 / 2026/07
    - "\\d{4}[./]\\d{1,2}(?![\\d])"
  place_patterns: []
  # 能力名与技术名可能较长或含拉丁字符（Agent Evaluation、FastAPI），放宽默认的 2-4 汉字限制
  name_candidate_pattern: "(?<![\\u4e00-\\u9fff])[\\u4e00-\\u9fff]{2,10}(?![\\u4e00-\\u9fff])|[A-Za-z][A-Za-z0-9_.+#-]{1,30}"
  name_exclude_surfaces: [资料, 相关内容, 公元前, 用户, 本人, 我们, 大家]

# 否定词：补充能力场景的反向证据措辞，用于确定性冲突扫描
negation_markers: [不, 未, 无, 非, 没有, 否认, 拒绝, 不会, 不具备, 缺乏, 欠缺, 没做过, 未实现, 没写过, 仅计划, 尚未, not, never, "no ", deny, refuse]
